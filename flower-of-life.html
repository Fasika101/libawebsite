<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flower of Life</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            height: 100%;
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior: none;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #000008 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            /* Prevent text selection on mobile */
            -webkit-user-select: none;
            user-select: none;
            /* Prevent tap highlight */
            -webkit-tap-highlight-color: transparent;
        }
        
        canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
        }
        
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #000008 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1s ease;
            padding: 20px;
            text-align: center;
        }
        
        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .start-title {
            color: #ffd700;
            font-size: clamp(1.5rem, 8vw, 3rem);
            font-weight: 300;
            letter-spacing: clamp(4px, 2vw, 10px);
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-bottom: clamp(15px, 4vh, 30px);
        }
        
        .start-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            letter-spacing: clamp(2px, 1vw, 4px);
            margin-bottom: clamp(30px, 6vh, 50px);
        }
        
        .start-btn {
            padding: clamp(15px, 3vh, 20px) clamp(40px, 10vw, 60px);
            font-size: clamp(1rem, 3vw, 1.2rem);
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 50px;
            color: #ffd700;
            font-weight: 400;
            letter-spacing: clamp(2px, 1vw, 4px);
            cursor: pointer;
            transition: all 0.3s ease;
            /* Better touch target */
            min-height: 50px;
        }
        
        .start-btn:hover,
        .start-btn:active {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
        }
        
        .controls {
            position: fixed;
            bottom: clamp(15px, 4vh, 30px);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(8px, 2vw, 15px);
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease;
            padding: 0 10px;
            max-width: 100%;
        }
        
        .controls.visible {
            opacity: 1;
        }
        
        .btn {
            padding: clamp(8px, 2vw, 12px) clamp(16px, 4vw, 28px);
            font-size: clamp(0.75rem, 2.5vw, 1rem);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 25px;
            color: #ffd700;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            /* Better touch target */
            min-height: 44px;
            white-space: nowrap;
        }
        
        .btn:hover,
        .btn:active {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .btn.active {
            background: rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        
        .title {
            position: fixed;
            top: clamp(15px, 4vh, 30px);
            color: #ffd700;
            font-size: clamp(1rem, 5vw, 2rem);
            font-weight: 300;
            letter-spacing: clamp(3px, 1.5vw, 8px);
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease;
            text-align: center;
            padding: 0 10px;
        }
        
        .title.visible {
            opacity: 1;
        }
        
        .info {
            position: fixed;
            top: clamp(45px, 10vh, 80px);
            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(0.7rem, 2.5vw, 0.9rem);
            letter-spacing: clamp(1px, 0.5vw, 2px);
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .info.visible {
            opacity: 1;
        }
        
        .circle-count {
            position: fixed;
            bottom: clamp(70px, 12vh, 100px);
            color: rgba(255, 215, 0, 0.6);
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            letter-spacing: clamp(1px, 0.5vw, 3px);
            opacity: 0;
            transition: opacity 0.5s ease;
            text-align: center;
        }
        
        .circle-count.visible {
            opacity: 1;
        }
        
        /* Landscape mode on mobile */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .title {
                top: 10px;
                font-size: 1rem;
            }
            
            .info {
                top: 35px;
                font-size: 0.7rem;
            }
            
            .circle-count {
                bottom: 55px;
                font-size: 0.8rem;
            }
            
            .controls {
                bottom: 10px;
                gap: 8px;
            }
            
            .btn {
                padding: 6px 14px;
                font-size: 0.7rem;
                min-height: 36px;
            }
        }
        
        /* Very small screens */
        @media screen and (max-width: 360px) {
            .btn {
                padding: 8px 12px;
                font-size: 0.7rem;
            }
            
            .start-title {
                font-size: 1.3rem;
                letter-spacing: 3px;
            }
            
            .start-btn {
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <div class="start-title">Flower of Life</div>
        <div class="start-subtitle">Sacred Geometry Experience</div>
        <button class="start-btn" onclick="startExperience()">Begin Journey</button>
    </div>
    
    <div class="title" id="title">Flower of Life</div>
    <div class="info" id="info">Sacred Geometry</div>
    <canvas id="canvas"></canvas>
    <div class="circle-count" id="circleCount">Circle 0 of 37</div>
    <div class="controls" id="controls">
        <button class="btn" onclick="toggleSound()">Mute Sound</button>
        <button class="btn" onclick="toggleRainbow()">Rainbow Mode</button>
        <button class="btn" onclick="redraw()">Redraw</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // ============================================
        // ALL VARIABLE DECLARATIONS (must be first)
        // ============================================
        
        // Audio context and nodes
        let audioCtx = null;
        let masterGain = null;
        let droneOsc1 = null;
        let droneOsc2 = null;
        let droneGain = null;
        let isSoundOn = true;
        
        // Dynamic sizing variables
        let centerX = 0;
        let centerY = 0;
        let baseRadius = 50;
        
        // Animation state
        let animationId;
        let isAnimating = false;
        let isRainbow = false;
        let time = 0;
        let drawProgress = 0;
        let isDrawing = false;
        let lastCircleIndex = -1;
        
        // Store all circle positions
        const circles = [];
        
        // Musical notes (pentatonic scale for pleasant sounds)
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
        
        // ============================================
        // FUNCTIONS
        // ============================================
        
        // Generate Flower of Life circles
        function generateFlowerOfLife(layers = 3) {
            circles.length = 0;
            
            // Center circle
            circles.push({ x: 0, y: 0, layer: 0 });
            
            // First ring - 6 circles
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI) / 3 - Math.PI / 6;
                circles.push({
                    x: baseRadius * Math.cos(angle),
                    y: baseRadius * Math.sin(angle),
                    layer: 1
                });
            }
            
            // Second ring - 12 circles
            if (layers >= 2) {
                for (let i = 0; i < 6; i++) {
                    const angle1 = (i * Math.PI) / 3 - Math.PI / 6;
                    const angle2 = ((i + 1) * Math.PI) / 3 - Math.PI / 6;
                    
                    circles.push({
                        x: 2 * baseRadius * Math.cos(angle1),
                        y: 2 * baseRadius * Math.sin(angle1),
                        layer: 2
                    });
                    
                    const midAngle = (angle1 + angle2) / 2;
                    circles.push({
                        x: Math.sqrt(3) * baseRadius * Math.cos(midAngle),
                        y: Math.sqrt(3) * baseRadius * Math.sin(midAngle),
                        layer: 2
                    });
                }
            }
            
            // Third ring - 18 circles
            if (layers >= 3) {
                for (let i = 0; i < 6; i++) {
                    const baseAngle = (i * Math.PI) / 3 - Math.PI / 6;
                    
                    circles.push({
                        x: 3 * baseRadius * Math.cos(baseAngle),
                        y: 3 * baseRadius * Math.sin(baseAngle),
                        layer: 3
                    });
                    
                    for (let j = 1; j <= 2; j++) {
                        const nextAngle = ((i + 1) * Math.PI) / 3 - Math.PI / 6;
                        const t = j / 3;
                        const midAngle = baseAngle + (nextAngle - baseAngle) * t;
                        
                        circles.push({
                            x: 2.65 * baseRadius * Math.cos(midAngle),
                            y: 2.65 * baseRadius * Math.sin(midAngle),
                            layer: 3
                        });
                    }
                }
            }
        }
        
        // Make canvas fill the screen
        function resizeCanvas() {
            // Use visualViewport for better mobile support
            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            
            canvas.width = vw;
            canvas.height = vh;
            
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
            
            // Calculate base radius based on screen size
            const minDimension = Math.min(canvas.width, canvas.height);
            baseRadius = minDimension * 0.07;
            
            // Ensure minimum size for visibility
            baseRadius = Math.max(baseRadius, 25);
            // Cap maximum size
            baseRadius = Math.min(baseRadius, 80);
            
            // Regenerate circles with new radius
            generateFlowerOfLife(3);
        }
        
        // Initialize Web Audio
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.3;
            masterGain.connect(audioCtx.destination);
            
            // Create ambient drone
            droneGain = audioCtx.createGain();
            droneGain.gain.value = 0;
            droneGain.connect(masterGain);
            
            // First drone oscillator
            droneOsc1 = audioCtx.createOscillator();
            droneOsc1.type = 'sine';
            droneOsc1.frequency.value = 55; // Low A
            droneOsc1.connect(droneGain);
            droneOsc1.start();
            
            // Second drone oscillator (fifth above)
            droneOsc2 = audioCtx.createOscillator();
            droneOsc2.type = 'sine';
            droneOsc2.frequency.value = 82.41; // Low E
            droneOsc2.connect(droneGain);
            droneOsc2.start();
            
            // Fade in drone
            droneGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 3);
        }
        
        // Play a bell-like tone for each circle
        function playCircleTone(circleIndex) {
            if (!audioCtx || !isSoundOn) return;
            
            const noteIndex = circleIndex % notes.length;
            const freq = notes[noteIndex];
            
            // Create oscillator for bell sound
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            // Bell-like sound with harmonics
            osc.type = 'sine';
            osc.frequency.value = freq;
            
            // Create additional harmonics for richness
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.value = freq * 2;
            const gain2 = audioCtx.createGain();
            gain2.gain.value = 0.3;
            
            const osc3 = audioCtx.createOscillator();
            osc3.type = 'sine';
            osc3.frequency.value = freq * 3;
            const gain3 = audioCtx.createGain();
            gain3.gain.value = 0.1;
            
            // Connect nodes
            osc.connect(gainNode);
            osc2.connect(gain2);
            gain2.connect(gainNode);
            osc3.connect(gain3);
            gain3.connect(gainNode);
            gainNode.connect(masterGain);
            
            // Envelope
            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.25, now + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 3);
            
            // Start and stop
            osc.start(now);
            osc2.start(now);
            osc3.start(now);
            osc.stop(now + 3);
            osc2.stop(now + 3);
            osc3.stop(now + 3);
        }
        
        // Play shimmer sound when complete
        function playCompletionSound() {
            if (!audioCtx || !isSoundOn) return;
            
            const now = audioCtx.currentTime;
            
            // Arpeggio of notes
            notes.forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq * 2;
                    osc.connect(gain);
                    gain.connect(masterGain);
                    
                    const t = audioCtx.currentTime;
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.15, t + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 2);
                    
                    osc.start(t);
                    osc.stop(t + 2);
                }, i * 150);
            });
        }
        
        // Get color based on time and position
        function getColor(index, total, alpha = 1) {
            if (isRainbow) {
                const hue = (time * 30 + (index / total) * 360) % 360;
                return `hsla(${hue}, 80%, 60%, ${alpha})`;
            } else {
                const pulse = Math.sin(time * 2 + index * 0.3) * 0.3 + 0.7;
                return `rgba(255, ${180 + Math.floor(pulse * 40)}, ${50 + Math.floor(pulse * 50)}, ${alpha * pulse})`;
            }
        }
        
        // Draw a single circle with glow
        function drawCircle(x, y, radius, color, progress = 1) {
            if (progress <= 0) return;
            
            const cx = centerX + x;
            const cy = centerY + y;
            
            ctx.beginPath();
            
            if (progress >= 1) {
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            } else {
                ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
            }
            
            ctx.strokeStyle = color;
            // Scale line width based on radius
            const isMobile = window.innerWidth < 768;
            ctx.lineWidth = isMobile ? 1.5 : 2;
            ctx.stroke();
        }
        
        // Draw the Flower of Life
        function drawFlowerOfLife() {
            const totalCircles = circles.length;
            const isMobile = window.innerWidth < 768;
            // Slow drawing: each circle takes about 1.5 seconds
            const drawSpeed = 0.7; // circles per second
            const circlesDone = Math.min(totalCircles, Math.floor(drawProgress * drawSpeed));
            const currentCircleProgress = (drawProgress * drawSpeed) % 1;
            
            // Update circle count display
            document.getElementById('circleCount').textContent = `Circle ${Math.min(circlesDone + 1, totalCircles)} of ${totalCircles}`;
            
            // Check if we've started a new circle
            if (circlesDone > lastCircleIndex && circlesDone < totalCircles) {
                lastCircleIndex = circlesDone;
                playCircleTone(circlesDone);
            }
            
            // Draw completed circles
            for (let i = 0; i < circlesDone && i < totalCircles; i++) {
                const circle = circles[i];
                const color = getColor(i, totalCircles);
                
                ctx.shadowColor = color;
                ctx.shadowBlur = isMobile ? 12 : 20;
                
                drawCircle(circle.x, circle.y, baseRadius, color, 1);
            }
            
            // Draw current circle being animated
            if (circlesDone < totalCircles && isDrawing) {
                const circle = circles[circlesDone];
                const color = getColor(circlesDone, totalCircles);
                ctx.shadowColor = color;
                ctx.shadowBlur = isMobile ? 15 : 25;
                drawCircle(circle.x, circle.y, baseRadius, color, currentCircleProgress);
            }
            
            // Check if drawing is complete
            if (circlesDone >= totalCircles && isDrawing) {
                isDrawing = false;
                playCompletionSound();
            }
            
            ctx.shadowBlur = 0;
        }
        
        // Draw pulsing effect when complete
        function drawPulsingEffect() {
            if (isDrawing) return;
            
            const isMobile = window.innerWidth < 768;
            const pulse = Math.sin(time * 1.5) * 0.5 + 0.5;
            const totalCircles = circles.length;
            
            for (let i = 0; i < totalCircles; i++) {
                const circle = circles[i];
                const color = getColor(i, totalCircles, 0.3 + pulse * 0.4);
                
                ctx.shadowColor = color;
                ctx.shadowBlur = isMobile ? (8 + pulse * 15) : (10 + pulse * 25);
                
                drawCircle(circle.x, circle.y, baseRadius, color, 1);
            }
            
            ctx.shadowBlur = 0;
        }
        
        // Draw center glow
        function drawCenterGlow() {
            const pulse = Math.sin(time * 2) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, baseRadius * 4
            );
            
            if (isRainbow) {
                const hue = (time * 30) % 360;
                gradient.addColorStop(0, `hsla(${hue}, 80%, 70%, ${0.2 * pulse})`);
                gradient.addColorStop(0.5, `hsla(${(hue + 60) % 360}, 80%, 50%, ${0.1 * pulse})`);
                gradient.addColorStop(1, 'transparent');
            } else {
                gradient.addColorStop(0, `rgba(255, 200, 100, ${0.15 * pulse})`);
                gradient.addColorStop(0.5, `rgba(255, 150, 50, ${0.05 * pulse})`);
                gradient.addColorStop(1, 'transparent');
            }
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        // Draw particle effects (reduced count on mobile for performance)
        function drawParticles() {
            const isMobile = window.innerWidth < 768;
            const numParticles = isMobile ? 30 : 50;
            
            for (let i = 0; i < numParticles; i++) {
                const angle = (i / numParticles) * Math.PI * 2 + time * 0.1;
                const radiusOffset = Math.sin(time * 0.5 + i * 0.5) * (baseRadius * 0.5);
                const radius = baseRadius * 3.5 + radiusOffset;
                
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                const alpha = Math.sin(time * 2 + i * 0.3) * 0.3 + 0.4;
                const size = isMobile ? 1 : 1 + Math.sin(time + i) * 0.5;
                
                const color = getColor(i, numParticles, alpha);
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = isMobile ? 5 : 8;
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }
        
        // Main animation loop
        function animate() {
            // Update center position (in case of resize)
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw effects
            drawCenterGlow();
            drawParticles();
            
            // Increment draw progress
            if (isDrawing) {
                drawProgress += 0.016; // ~60fps
            }
            
            drawFlowerOfLife();
            drawPulsingEffect();
            
            // Update time
            time += 0.016;
            
            // Modulate drone if audio is on
            if (audioCtx && droneOsc1 && isSoundOn) {
                const wobble = Math.sin(time * 0.5) * 2;
                droneOsc1.frequency.value = 55 + wobble;
                droneOsc2.frequency.value = 82.41 + wobble * 1.5;
            }
            
            if (isAnimating) {
                animationId = requestAnimationFrame(animate);
            }
        }
        
        // Start the experience
        function startExperience() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('title').classList.add('visible');
            document.getElementById('info').classList.add('visible');
            document.getElementById('controls').classList.add('visible');
            document.getElementById('circleCount').classList.add('visible');
            
            // Initialize audio (needs user interaction)
            initAudio();
            
            // Start animation
            isAnimating = true;
            isDrawing = true;
            drawProgress = 0;
            lastCircleIndex = -1;
            
            animate();
        }
        
        // Control functions
        function toggleSound() {
            isSoundOn = !isSoundOn;
            const btn = document.querySelector('.controls .btn');
            btn.textContent = isSoundOn ? 'Mute Sound' : 'Unmute Sound';
            btn.classList.toggle('active', !isSoundOn);
            
            if (droneGain) {
                droneGain.gain.linearRampToValueAtTime(
                    isSoundOn ? 0.15 : 0,
                    audioCtx.currentTime + 0.5
                );
            }
        }
        
        function toggleRainbow() {
            isRainbow = !isRainbow;
            const btns = document.querySelectorAll('.controls .btn');
            btns[1].classList.toggle('active', isRainbow);
        }
        
        function redraw() {
            drawProgress = 0;
            isDrawing = true;
            lastCircleIndex = -1;
        }
        
        // ============================================
        // INITIALIZATION (runs after all definitions)
        // ============================================
        
        // Initial canvas setup
        resizeCanvas();
        
        // Event listeners for resize
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 100);
        });
        
        // Handle visual viewport changes (mobile keyboard, etc.)
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeCanvas);
        }
        
        // Prevent double-tap zoom on buttons
        document.querySelectorAll('.btn, .start-btn').forEach(btn => {
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                btn.click();
            });
        });
        
        // Prevent pull-to-refresh and bounce effects
        document.body.addEventListener('touchmove', (e) => {
            if (e.target === canvas || e.target === document.body) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
