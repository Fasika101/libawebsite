<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Beta Giyorgis - Church of St. George</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            height: 100%;
            overscroll-behavior: none;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: radial-gradient(ellipse at center, #2d1810 0%, #1a0f0a 50%, #0d0705 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
        }
        
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #2d1810 0%, #1a0f0a 50%, #0d0705 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1.5s ease;
            padding: 20px;
            text-align: center;
        }
        
        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .start-title {
            color: #d4a853;
            font-size: clamp(1.4rem, 7vw, 2.8rem);
            font-weight: 300;
            letter-spacing: clamp(3px, 1.5vw, 8px);
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(212, 168, 83, 0.5);
            margin-bottom: clamp(10px, 2vh, 20px);
        }
        
        .start-subtitle {
            color: #c17f59;
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            letter-spacing: clamp(2px, 1vw, 4px);
            margin-bottom: clamp(5px, 1vh, 10px);
        }
        
        .start-description {
            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(0.75rem, 2vw, 0.95rem);
            letter-spacing: clamp(1px, 0.5vw, 2px);
            margin-bottom: clamp(30px, 5vh, 50px);
            max-width: 400px;
            line-height: 1.6;
        }
        
        .start-btn {
            padding: clamp(15px, 3vh, 20px) clamp(40px, 10vw, 60px);
            font-size: clamp(1rem, 3vw, 1.2rem);
            background: rgba(212, 168, 83, 0.1);
            border: 2px solid rgba(212, 168, 83, 0.5);
            border-radius: 50px;
            color: #d4a853;
            font-weight: 400;
            letter-spacing: clamp(2px, 1vw, 4px);
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 50px;
        }
        
        .start-btn:hover,
        .start-btn:active {
            background: rgba(212, 168, 83, 0.2);
            box-shadow: 0 0 40px rgba(212, 168, 83, 0.4);
            transform: scale(1.05);
        }
        
        .controls {
            position: fixed;
            bottom: clamp(15px, 4vh, 30px);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(8px, 2vw, 15px);
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease;
            padding: 0 10px;
            max-width: 100%;
        }
        
        .controls.visible {
            opacity: 1;
        }
        
        .btn {
            padding: clamp(8px, 2vw, 12px) clamp(16px, 4vw, 28px);
            font-size: clamp(0.75rem, 2.5vw, 1rem);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 168, 83, 0.3);
            border-radius: 25px;
            color: #d4a853;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            min-height: 44px;
            white-space: nowrap;
        }
        
        .btn:hover,
        .btn:active {
            background: rgba(212, 168, 83, 0.2);
            box-shadow: 0 0 20px rgba(212, 168, 83, 0.3);
        }
        
        .btn.active {
            background: rgba(212, 168, 83, 0.3);
            box-shadow: 0 0 15px rgba(212, 168, 83, 0.4);
        }
        
        .title {
            position: fixed;
            top: clamp(15px, 4vh, 30px);
            color: #d4a853;
            font-size: clamp(0.9rem, 4vw, 1.6rem);
            font-weight: 300;
            letter-spacing: clamp(2px, 1vw, 6px);
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(212, 168, 83, 0.5);
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease;
            text-align: center;
            padding: 0 10px;
        }
        
        .title.visible {
            opacity: 1;
        }
        
        .info {
            position: fixed;
            top: clamp(45px, 10vh, 75px);
            color: rgba(193, 127, 89, 0.7);
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            letter-spacing: clamp(1px, 0.5vw, 2px);
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .info.visible {
            opacity: 1;
        }
        
        .progress-text {
            position: fixed;
            bottom: clamp(70px, 12vh, 100px);
            color: rgba(212, 168, 83, 0.6);
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            letter-spacing: clamp(1px, 0.5vw, 3px);
            opacity: 0;
            transition: opacity 0.5s ease;
            text-align: center;
        }
        
        .progress-text.visible {
            opacity: 1;
        }
        
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .title { top: 10px; font-size: 0.9rem; }
            .info { top: 32px; font-size: 0.65rem; }
            .progress-text { bottom: 50px; font-size: 0.75rem; }
            .controls { bottom: 10px; gap: 8px; }
            .btn { padding: 6px 14px; font-size: 0.7rem; min-height: 36px; }
        }
        
        @media screen and (max-width: 360px) {
            .btn { padding: 8px 12px; font-size: 0.7rem; }
            .start-title { font-size: 1.2rem; letter-spacing: 3px; }
            .start-btn { padding: 12px 30px; }
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <div class="start-title">Beta Giyorgis</div>
        <div class="start-subtitle">Church of St. George</div>
        <div class="start-description">The iconic triple-cross pattern of Lalibela's most famous rock-hewn church, carved 40 feet into solid volcanic rock in 12th century Ethiopia</div>
        <button class="start-btn" onclick="startExperience()">Begin</button>
    </div>
    
    <div class="title" id="title">Beta Giyorgis</div>
    <div class="info" id="info">Lalibela, Ethiopia</div>
    <canvas id="canvas"></canvas>
    <div class="progress-text" id="progressText">Drawing outer cross...</div>
    <div class="controls" id="controls">
        <button class="btn" onclick="toggleSound()">Mute Sound</button>
        <button class="btn" onclick="toggleGlow()">Toggle Glow</button>
        <button class="btn" onclick="redraw()">Redraw</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // ============================================
        // VARIABLE DECLARATIONS
        // ============================================
        
        let audioCtx = null;
        let masterGain = null;
        let droneOsc1 = null;
        let droneOsc2 = null;
        let droneOsc3 = null;
        let droneGain = null;
        let isSoundOn = true;
        let glowEnabled = true;
        
        let centerX = 0;
        let centerY = 0;
        let baseSize = 100;
        
        let animationId;
        let isAnimating = false;
        let time = 0;
        let drawProgress = 0;
        let isDrawing = false;
        let currentPhase = 0;
        
        // Ethiopian-inspired color palette
        const colors = {
            gold: '#d4a853',
            darkGold: '#a67c3d',
            copper: '#c17f59',
            earth: '#8b5a2b',
            stone: '#6b4423',
            shadow: '#3d2817'
        };
        
        // Ethiopian church scale (pentatonic-like)
        const notes = [174.61, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00];
        
        // ============================================
        // FUNCTIONS
        // ============================================
        
        function resizeCanvas() {
            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            
            canvas.width = vw;
            canvas.height = vh;
            
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
            
            const minDimension = Math.min(canvas.width, canvas.height);
            baseSize = minDimension * 0.35;
            baseSize = Math.max(baseSize, 100);
            baseSize = Math.min(baseSize, 300);
        }
        
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.25;
            masterGain.connect(audioCtx.destination);
            
            droneGain = audioCtx.createGain();
            droneGain.gain.value = 0;
            droneGain.connect(masterGain);
            
            // Deep drone - Ethiopian liturgical feel
            droneOsc1 = audioCtx.createOscillator();
            droneOsc1.type = 'sine';
            droneOsc1.frequency.value = 65.41; // Low C
            droneOsc1.connect(droneGain);
            droneOsc1.start();
            
            droneOsc2 = audioCtx.createOscillator();
            droneOsc2.type = 'sine';
            droneOsc2.frequency.value = 98.00; // G
            droneOsc2.connect(droneGain);
            droneOsc2.start();
            
            droneOsc3 = audioCtx.createOscillator();
            droneOsc3.type = 'triangle';
            droneOsc3.frequency.value = 130.81; // C octave
            const osc3Gain = audioCtx.createGain();
            osc3Gain.gain.value = 0.3;
            droneOsc3.connect(osc3Gain);
            osc3Gain.connect(droneGain);
            droneOsc3.start();
            
            droneGain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 4);
        }
        
        function playTone(phase) {
            if (!audioCtx || !isSoundOn) return;
            
            const freqs = [notes[0], notes[2], notes[4], notes[5], notes[7]];
            const freq = freqs[phase % freqs.length];
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = freq;
            
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.value = freq * 1.5;
            const gain2 = audioCtx.createGain();
            gain2.gain.value = 0.4;
            
            osc.connect(gainNode);
            osc2.connect(gain2);
            gain2.connect(gainNode);
            gainNode.connect(masterGain);
            
            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 4);
            
            osc.start(now);
            osc2.start(now);
            osc.stop(now + 4);
            osc2.stop(now + 4);
        }
        
        function playCompletionChord() {
            if (!audioCtx || !isSoundOn) return;
            
            [0, 2, 4, 7].forEach((idx, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = notes[idx] * 2;
                    osc.connect(gain);
                    gain.connect(masterGain);
                    
                    const t = audioCtx.currentTime;
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.2, t + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 3);
                    
                    osc.start(t);
                    osc.stop(t + 3);
                }, i * 200);
            });
        }
        
        // Draw a Greek cross shape
        function drawCross(cx, cy, size, armWidth, color, progress = 1) {
            if (progress <= 0) return;
            
            const halfArm = armWidth / 2;
            const halfSize = size / 2;
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineCap = 'square';
            ctx.lineJoin = 'miter';
            
            if (glowEnabled) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
            }
            
            // The cross has 12 corners - draw as a path
            // Starting from top-left of top arm, going clockwise
            const points = [
                // Top arm
                { x: cx - halfArm, y: cy - halfSize },
                { x: cx + halfArm, y: cy - halfSize },
                // Right arm top
                { x: cx + halfArm, y: cy - halfArm },
                { x: cx + halfSize, y: cy - halfArm },
                { x: cx + halfSize, y: cy + halfArm },
                // Right arm bottom to bottom arm
                { x: cx + halfArm, y: cy + halfArm },
                { x: cx + halfArm, y: cy + halfSize },
                // Bottom arm
                { x: cx - halfArm, y: cy + halfSize },
                // Left arm bottom
                { x: cx - halfArm, y: cy + halfArm },
                { x: cx - halfSize, y: cy + halfArm },
                { x: cx - halfSize, y: cy - halfArm },
                // Back to start
                { x: cx - halfArm, y: cy - halfArm }
            ];
            
            const totalPoints = points.length;
            const pointsToDraw = Math.floor(progress * totalPoints);
            const partialProgress = (progress * totalPoints) % 1;
            
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            
            for (let i = 1; i <= pointsToDraw && i < totalPoints; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            
            // Partial line to next point
            if (pointsToDraw < totalPoints - 1 && partialProgress > 0) {
                const curr = points[pointsToDraw];
                const next = points[pointsToDraw + 1];
                const px = curr.x + (next.x - curr.x) * partialProgress;
                const py = curr.y + (next.y - curr.y) * partialProgress;
                ctx.lineTo(px, py);
            }
            
            // Close the path if complete
            if (progress >= 1) {
                ctx.closePath();
            }
            
            ctx.stroke();
            
            // Fill with semi-transparent color when complete
            if (progress >= 1) {
                ctx.fillStyle = color + '15';
                ctx.fill();
            }
            
            ctx.shadowBlur = 0;
        }
        
        // Draw stepped border (like carved stone)
        function drawSteppedBorder(cx, cy, size, armWidth, color, offset, progress = 1) {
            if (progress <= 0) return;
            
            const adjustedSize = size + offset;
            const adjustedArm = armWidth + offset * 0.6;
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            
            if (glowEnabled) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
            }
            
            drawCross(cx, cy, adjustedSize, adjustedArm, color, progress);
            ctx.shadowBlur = 0;
        }
        
        // Draw decorative corner elements
        function drawCornerDetails(cx, cy, size, color, progress = 1) {
            if (progress <= 0) return;
            
            const cornerDist = size * 0.5;
            const detailSize = size * 0.08;
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            
            if (glowEnabled) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
            }
            
            // Draw small crosses at the inner corners
            const corners = [
                { x: cx - cornerDist + detailSize, y: cy - cornerDist + detailSize },
                { x: cx + cornerDist - detailSize, y: cy - cornerDist + detailSize },
                { x: cx + cornerDist - detailSize, y: cy + cornerDist - detailSize },
                { x: cx - cornerDist + detailSize, y: cy + cornerDist - detailSize }
            ];
            
            const numCorners = Math.floor(progress * 4);
            const partialProgress = (progress * 4) % 1;
            
            for (let i = 0; i < numCorners && i < corners.length; i++) {
                const c = corners[i];
                // Small cross
                ctx.beginPath();
                ctx.moveTo(c.x - detailSize, c.y);
                ctx.lineTo(c.x + detailSize, c.y);
                ctx.moveTo(c.x, c.y - detailSize);
                ctx.lineTo(c.x, c.y + detailSize);
                ctx.stroke();
            }
            
            if (numCorners < corners.length && partialProgress > 0) {
                const c = corners[numCorners];
                ctx.beginPath();
                ctx.moveTo(c.x - detailSize * partialProgress, c.y);
                ctx.lineTo(c.x + detailSize * partialProgress, c.y);
                ctx.moveTo(c.x, c.y - detailSize * partialProgress);
                ctx.lineTo(c.x, c.y + detailSize * partialProgress);
                ctx.stroke();
            }
            
            ctx.shadowBlur = 0;
        }
        
        function drawCenterStar(cx, cy, size, color, progress = 1) {
            if (progress <= 0) return;
            
            const starSize = size * 0.15;
            const points = 8;
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            
            if (glowEnabled) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
            }
            
            ctx.beginPath();
            for (let i = 0; i <= points * progress; i++) {
                const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
                const r = i % 2 === 0 ? starSize : starSize * 0.5;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            if (progress >= 1) {
                ctx.closePath();
                ctx.fillStyle = color + '30';
                ctx.fill();
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
        
        function drawAmbientGlow() {
            const pulse = Math.sin(time * 1.5) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, baseSize * 1.5
            );
            
            gradient.addColorStop(0, `rgba(212, 168, 83, ${0.1 * pulse})`);
            gradient.addColorStop(0.5, `rgba(193, 127, 89, ${0.05 * pulse})`);
            gradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        function drawParticles() {
            const isMobile = window.innerWidth < 768;
            const numParticles = isMobile ? 20 : 40;
            
            for (let i = 0; i < numParticles; i++) {
                const angle = (i / numParticles) * Math.PI * 2 + time * 0.05;
                const radiusBase = baseSize * 1.3;
                const radiusOffset = Math.sin(time * 0.3 + i * 0.5) * 30;
                const radius = radiusBase + radiusOffset;
                
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                const alpha = Math.sin(time + i * 0.3) * 0.3 + 0.4;
                
                ctx.beginPath();
                ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 168, 83, ${alpha})`;
                if (glowEnabled) {
                    ctx.shadowColor = colors.gold;
                    ctx.shadowBlur = 5;
                }
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }
        
        function updateProgressText() {
            const phases = [
                'Drawing outer cross...',
                'Drawing outer border...',
                'Drawing middle cross...',
                'Drawing middle border...',
                'Drawing inner cross...',
                'Drawing corner details...',
                'Drawing center star...',
                'Complete - ቤተ ጊዮርጊስ'
            ];
            document.getElementById('progressText').textContent = phases[Math.min(currentPhase, phases.length - 1)];
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawAmbientGlow();
            drawParticles();
            
            // Animation phases - slow drawing
            const phaseLength = 3; // seconds per phase
            const totalPhases = 7;
            
            if (isDrawing) {
                drawProgress += 0.008; // Slow progression
                
                const newPhase = Math.min(Math.floor(drawProgress / phaseLength), totalPhases);
                if (newPhase > currentPhase) {
                    currentPhase = newPhase;
                    playTone(currentPhase);
                    updateProgressText();
                }
            }
            
            const phaseProgress = (p) => {
                const start = p * phaseLength;
                const progress = (drawProgress - start) / phaseLength;
                return Math.max(0, Math.min(1, progress));
            };
            
            // Outer cross (largest)
            const outerSize = baseSize;
            const outerArm = baseSize * 0.35;
            drawCross(centerX, centerY, outerSize, outerArm, colors.gold, phaseProgress(0));
            
            // Outer stepped border
            drawSteppedBorder(centerX, centerY, outerSize, outerArm, colors.darkGold, 8, phaseProgress(1));
            
            // Middle cross
            const middleSize = baseSize * 0.65;
            const middleArm = baseSize * 0.25;
            drawCross(centerX, centerY, middleSize, middleArm, colors.copper, phaseProgress(2));
            
            // Middle stepped border
            drawSteppedBorder(centerX, centerY, middleSize, middleArm, colors.earth, 6, phaseProgress(3));
            
            // Inner cross (smallest)
            const innerSize = baseSize * 0.35;
            const innerArm = baseSize * 0.15;
            drawCross(centerX, centerY, innerSize, innerArm, colors.gold, phaseProgress(4));
            
            // Corner details
            drawCornerDetails(centerX, centerY, middleSize, colors.darkGold, phaseProgress(5));
            
            // Center star
            drawCenterStar(centerX, centerY, innerSize, colors.gold, phaseProgress(6));
            
            // Check completion
            if (drawProgress >= totalPhases * phaseLength && isDrawing) {
                isDrawing = false;
                playCompletionChord();
                updateProgressText();
            }
            
            // Pulsing glow when complete
            if (!isDrawing && drawProgress > 0) {
                const pulse = Math.sin(time * 2) * 0.15 + 0.85;
                ctx.globalAlpha = pulse;
                drawCross(centerX, centerY, outerSize, outerArm, colors.gold, 1);
                drawCross(centerX, centerY, middleSize, middleArm, colors.copper, 1);
                drawCross(centerX, centerY, innerSize, innerArm, colors.gold, 1);
                ctx.globalAlpha = 1;
            }
            
            time += 0.016;
            
            if (audioCtx && droneOsc1 && isSoundOn) {
                const wobble = Math.sin(time * 0.3) * 1;
                droneOsc1.frequency.value = 65.41 + wobble;
                droneOsc2.frequency.value = 98.00 + wobble * 1.5;
            }
            
            if (isAnimating) {
                animationId = requestAnimationFrame(animate);
            }
        }
        
        function startExperience() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('title').classList.add('visible');
            document.getElementById('info').classList.add('visible');
            document.getElementById('controls').classList.add('visible');
            document.getElementById('progressText').classList.add('visible');
            
            initAudio();
            
            isAnimating = true;
            isDrawing = true;
            drawProgress = 0;
            currentPhase = 0;
            updateProgressText();
            
            animate();
        }
        
        function toggleSound() {
            isSoundOn = !isSoundOn;
            const btn = document.querySelector('.controls .btn');
            btn.textContent = isSoundOn ? 'Mute Sound' : 'Unmute Sound';
            btn.classList.toggle('active', !isSoundOn);
            
            if (droneGain) {
                droneGain.gain.linearRampToValueAtTime(
                    isSoundOn ? 0.2 : 0,
                    audioCtx.currentTime + 0.5
                );
            }
        }
        
        function toggleGlow() {
            glowEnabled = !glowEnabled;
            const btns = document.querySelectorAll('.controls .btn');
            btns[1].classList.toggle('active', !glowEnabled);
            btns[1].textContent = glowEnabled ? 'Toggle Glow' : 'Enable Glow';
        }
        
        function redraw() {
            drawProgress = 0;
            isDrawing = true;
            currentPhase = 0;
            updateProgressText();
        }
        
        // ============================================
        // INITIALIZATION
        // ============================================
        
        resizeCanvas();
        
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 100);
        });
        
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeCanvas);
        }
        
        document.querySelectorAll('.btn, .start-btn').forEach(btn => {
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                btn.click();
            });
        });
        
        document.body.addEventListener('touchmove', (e) => {
            if (e.target === canvas || e.target === document.body) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
